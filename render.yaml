services:
  - type: web
    name: chronicle-gate-online
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run verify
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: CHRONICLE_MAX_ROOMS
        value: 32
      - key: CHRONICLE_ROOM_TTL_HOURS
        value: 24
      - key: CHRONICLE_CHAT_TTL_MINUTES
        value: 30
      - key: CHRONICLE_MAX_ROOM_KB
        value: 256
