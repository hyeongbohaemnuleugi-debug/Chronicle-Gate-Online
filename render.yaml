services:
  - type: web
    name: neon-pop-click
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neon-pop-click-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: neon-pop-click-db
    plan: free
    databaseName: neon_pop_click
    user: neon_pop_click_user
