<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121a1f">
  <meta name="description" content="친구 1–4명과 단서와 비밀을 나누며 만들어 가는 일곱 편의 이야기. 크로니클 게이트 이야기 탁자.">
  <title>크로니클 게이트 · 이야기 탁자</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/game/styles.css?v=15000">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="크로니클 게이트 처음으로"><span class="brand-mark" aria-hidden="true">✦</span><span>CHRONICLE <b>GATE</b><small>이야기 탁자</small></span></a>
    <nav class="header-actions" aria-label="게임 메뉴">
      <span id="connection" class="connection"></span>
      <button id="sound-toggle" class="icon-button" type="button" aria-label="소리 켜기" title="소리 켜기">♪ <span>소리 켜기</span></button>
      <button data-action="audio-settings" class="icon-button settings-link" type="button" aria-label="음량 설정">음량</button>
      <button data-action="help" class="icon-button" type="button">플레이 방법</button>
    </nav>
  </header>
  <main id="main" tabindex="-1">
    <section id="home-view" class="page home-view">
      <div id="home-content"><div class="loading-state"><span class="loader" aria-hidden="true"></span><h1>이야기 책장을 여는 중…</h1><p>시나리오와 플레이 화면을 준비하고 있어요.</p></div></div>
    </section>
    <section id="lobby-view" class="page lobby-view" hidden></section>
    <section id="game-view" class="game-view" hidden></section>
  </main>
  <footer id="site-footer" class="site-footer"><span>CHRONICLE GATE · STORY TABLE v15</span><span>7개의 세계 · 28개 직업 · 당신들의 선택</span></footer>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="entry-dialog" class="modal entry-dialog" aria-labelledby="entry-title"></dialog>
  <dialog id="preview-dialog" class="modal preview-dialog" aria-labelledby="preview-title"></dialog>
  <dialog id="info-dialog" class="modal info-dialog" aria-labelledby="info-title"></dialog>
  <input id="save-file" type="file" accept=".json,application/json" hidden>
  <noscript><div class="noscript">이 게임은 JavaScript가 필요합니다. 브라우저에서 JavaScript를 켜 주세요.</div></noscript>
  <script type="module" src="/game/app.js?v=15000"></script>
</body>
</html>
